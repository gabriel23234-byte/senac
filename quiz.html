    :root {

      --card: #fffdf7;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      width: 100%;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .beach-app {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #c8f1f4 0%, #dff8f4 29%, #fff2d1 29.1%, #fff8e9 100%);
    }

    .beach-app::before,
    .beach-app::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0.5;
    }

    .beach-app::before {
      width: 18rem;
      height: 18rem;
      top: -7rem;
      right: -6rem;
      background: radial-gradient(circle, #ffe49b 0 42%, transparent 43%);
    }

    .beach-app::after {
      width: 32rem;
      height: 12rem;
      bottom: -7rem;
      left: -7rem;
      background: repeating-radial-gradient(ellipse at center, transparent 0 10px, rgba(5, 126, 159, 0.10) 11px 13px);
    }

    .content-shell {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 2.5rem;
      position: relative;
      z-index: 1;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.48rem 0.78rem;
      margin: 0 0 1rem;
      border-radius: 999px;
      color: #075d78;
      background: #ffffffb8;
      box-shadow: 0 8px 22px rgba(14, 95, 111, 0.10);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      max-width: 640px;
      font-family: "Fraunces", serif;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro-copy {
      max-width: 610px;
      margin: 1rem 0 0;
      line-height: 1.65;
    }

    .quiz-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      background: #ef765d;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 22px rgba(239, 118, 93, 0.28);
      transition: transform 200ms ease, background 200ms ease;
    }

    .quiz-link-btn:hover {
      transform: translateY(-2px);
      background: #e05e43;
    }

    .coast-illustration {
      width: 170px;
      height: 130px;
      position: relative;
      border-radius: 30px 30px 46px 46px;
      overflow: hidden;
      background: linear-gradient(180deg, #8edce5 0 52%, #35a5bb 52% 67%, #f8d48b 67%);
      box-shadow: 0 18px 40px rgba(10, 90, 112, 0.16);
    }

    .coast-illustration .sun {
      position: absolute;
      top: 16px;
      right: 24px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #ffd467;
      box-shadow: 0 0 0 8px rgba(255, 212, 103, 0.23);
    }

    .coast-illustration .wave {
      position: absolute;
      width: 150%;
      height: 33px;
      left: -24%;
      border-radius: 50%;
      border-top: 6px solid #dff9f7;
      transform: rotate(-4deg);
    }

    .coast-illustration .wave-one { top: 62px; }
    .coast-illustration .wave-two { top: 78px; opacity: 0.7; transform: rotate(4deg); }

    .coast-illustration .umbrella {
      position: absolute;
      bottom: 17px;
      left: 31px;
      width: 0;
      height: 0;
      border-left: 21px solid transparent;
      border-right: 21px solid transparent;
      border-bottom: 24px solid #ef765d;
    }

    .coast-illustration .umbrella::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 32px;
      top: 23px;
      left: -1px;
      border-radius: 999px;
      background: #704837;
    }

    .timeline-region { position: relative; }

    .timeline-line {
      position: absolute;
      top: 2rem;
      bottom: 2rem;
      left: 29px;
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(180deg, #f4b345 0%, #2cabc0 42%, #ef765d 100%);
    }

    .timeline-list {
      position: relative;
      display: grid;
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline-item {
      position: relative;
      padding-left: 4.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 550ms ease, transform 550ms ease;
    }

    .timeline-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .timeline-marker {
      position: absolute;
      top: 1.4rem;
      left: 17px;
      width: 27px;
      height: 27px;
      z-index: 1;
      border: 5px solid #fff8e9;
      border-radius: 50%;
      background: #057e9f;
      box-shadow: 0 0 0 2px rgba(5, 126, 159, 0.26);
      transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;
    }

    .timeline-item.is-active .timeline-marker {
      transform: scale(1.18);
      background: #ef765d;
      box-shadow: 0 0 0 5px rgba(239, 118, 93, 0.18);
    }

    .timeline-toggle {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.95rem;
      width: 100%;
      padding: 1.05rem 1.2rem;
      text-align: left;
      cursor: pointer;
      border: 1px solid rgba(16, 85, 102, 0.11);
      border-radius: 20px;
      background: #fffdf7;
      box-shadow: 0 8px 20px rgba(24, 103, 113, 0.08);
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .timeline-toggle:hover {
      transform: translateY(-3px);
      border-color: rgba(5, 126, 159, 0.35);
      box-shadow: 0 15px 28px rgba(24, 103, 113, 0.14);
    }

    .timeline-toggle:focus-visible {
      outline: 4px solid rgba(246, 181, 71, 0.7);
      outline-offset: 4px;
    }

    .timeline-item.is-active .timeline-toggle {
      border-color: #ef765d;
      box-shadow: 0 16px 31px rgba(183, 77, 58, 0.16);
      transform: translateX(6px);
    }

    .time-badge {
      min-width: 120px;
      height: fit-content;
      padding: 0.43rem 0.55rem;
      border-radius: 10px;
      color: #075d78;
      background: #e4f6f4;
      font-weight: 700;
      text-align: center;
    }

    .event-content { min-width: 0; }

    .event-heading {
      display: flex;
      align-items: center;
      gap: 0.52rem;
      margin: 0;
    }

    .event-icon {
      display: inline-grid;
      width: 1.7rem;
      height: 1.7rem;
      place-items: center;
      border-radius: 50%;
      background: #fff0cf;
      font-size: 1rem;
      flex: 0 0 auto;
    }

    .event-title {
      font-family: "Fraunces", serif;
      line-height: 1.2;
    }

    .event-description {
      display: block;
      margin-top: 0.34rem;
      line-height: 1.55;
    }

    .footer-note {
      margin: 2.5rem auto 0;
      padding-top: 1.25rem;
      border-top: 1px dashed rgba(7, 93, 120, 0.30);
      text-align: center;
    }

    @media (max-width: 640px) {
      .content-shell { padding: 2.4rem 1rem 2rem; }

      .intro-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }

      .coast-illustration {
        width: 100%;
        height: 92px;
        order: -1;
      }

      .timeline-item { padding-left: 3.75rem; }
      .timeline-line { left: 23px; }
      .timeline-marker { left: 11px; }

      .timeline-toggle {
        grid-template-columns: 1fr;
        gap: 0.68rem;
        padding: 1rem;
      }

      .time-badge {
        width: fit-content;
        min-width: 100px;
      }

      .timeline-item.is-active .timeline-toggle { transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .timeline-item {
        opacity: 1;
        transform: none;
      }
    }
  </style>

    <footer class="footer-note">
     <p data-template-id="footer-message" class="canva-text m-0" style="color: rgb(40, 97, 118); font-weight: 400; font-style: italic; font-size: 15px;">Click on a timeline item to view details.</p>
    </footer>
   </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const items = Array.from(document.querySelectorAll(".timeline-item"));
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function setActiveItem(selectedItem) {
        items.forEach(function (item) {
          const isSelected = item === selectedItem;
          item.classList.toggle("is-active", isSelected);
          item.querySelector(".timeline-toggle").setAttribute("aria-pressed", String(isSelected));
        });
      }

      items.forEach(function (item) {
        const button = item.querySelector(".timeline-toggle");
        button.addEventListener("click", function () {
          setActiveItem(item);
        });
      });

      if (reduceMotion || !("IntersectionObserver" in window)) {
        items.forEach(function (item) {
          item.classList.add("is-visible");
        });
        return;
      }

      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.16 });

      items.forEach(function (item) {
        observer.observe(item);
      });
    });
  </script>
